name: local_shout_billing
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 3.0.1+1

environment:
  sdk: ^3.5.4

isar_version: &isar_version 3.3.0-dev.3

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  ionicons: ^0.2.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.7
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  flutter_form_bloc: ^0.31.0
  cached_network_image: ^3.2.3
  image_picker: ^1.1.2
  file_picker: ^10.3.3
  formz: ^0.4.1
  flutter_screenutil: ^5.0.0
  fluttertoast: ^8.2.12
  toastification: ^0.0.3
  bloc_concurrency: ^0.2.5
  carousel_slider: ^4.2.1
  flutter_image_slideshow: ^0.1.6
  photo_view: ^0.15.0
  top_snackbar_flutter: ^3.1.0
  vector_math: ^2.1.4
  convex_bottom_bar: ^3.2.0
  shimmer: ^3.0.0
  share_plus: ^10.0.2
  permission_handler: ^11.0.1
  open_file: ^3.5.10
  path_provider: ^2.1.1
  dio: ^5.5.0+1
  url_launcher: ^6.1.11
  # isar: ^3.1.0+1
  # isar_flutter_libs: ^3.1.0+1
  isar_community: 
    version: *isar_version
  isar_community_flutter_libs: # contains Isar Core
    version: *isar_version
  dropdown_search: ^5.0.6
  connectivity_plus: ^6.0.3
  pinput: ^5.0.0
  shared_preferences: ^2.3.3
  flutter_pdfview: ^1.4.0
  flutter_rating_bar: ^4.0.1
  package_info_plus: ^8.0.0

  

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  # isar_generator: ^3.1.0+1
  # build_runner: ^2.3.3
  isar_community_generator: 
    version: *isar_version
  build_runner: any

flutter_icons:
  android: true
  ios: true
  image_path_android: "assets/icons/icon.png"
  image_path_ios: "assets/icons/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/